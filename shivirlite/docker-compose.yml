version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: shivir_lite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 7499
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: shivir_lite
      DB_USER: postgres
      DB_PASSWORD: 7499
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
